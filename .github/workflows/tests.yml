name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgis-table-source:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: martin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d martin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/martin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Seed disposable PostGIS fixture
        run: python tests/seed_database.py
      - name: Validate shell syntax
        run: bash -n tests/smoke-test.sh
      - name: Test Martin catalog, TileJSON, and tile endpoint
        run: bash tests/smoke-test.sh
