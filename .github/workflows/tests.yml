name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgis-table-source:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: martin_test
        ports:
          # 15432, not 5432: the host already runs Postgres on 5432, so
          # publishing the default killed every run with
          # "Bind for 0.0.0.0:5432 failed: port is already allocated".
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d martin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:15432/martin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Seed disposable PostGIS fixture
        run: python tests/seed_database.py
      - name: Validate shell syntax for every example
        run: find examples tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Test Martin catalog, TileJSON, and tile endpoint
        run: bash tests/smoke-test.sh
